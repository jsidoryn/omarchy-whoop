name: Ruby and JavaScript tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruby-js-tests:
    name: Ruby and JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run Ruby and JavaScript tests
        env:
          RUBY_BIN: ruby
        run: ./tests/run
