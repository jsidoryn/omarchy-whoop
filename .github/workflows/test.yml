name: Ruby and JavaScript tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruby-js-tests:
    name: Ruby and JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Ruby and JavaScript tests
        env:
          RUBY_BIN: ruby
        run: ./tests/run
